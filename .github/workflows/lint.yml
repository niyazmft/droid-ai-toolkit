name: Lint Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # lint:all includes ktlint, which is a JVM program.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install

      - name: Run Lint Audit
        run: pnpm run lint:all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The engine (`install.sh --api …`) is the contract the app is written against, so it is
  # tested on every PR instead of only on a phone. These tests are black-box: no Termux, no
  # device, just bash + jq — which is exactly what a wrong event or a stray `echo` on stdout
  # would otherwise reach the app as, undetected until someone tapped the button.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `--api` refuses to run without jq; ubuntu-latest ships it, but say so explicitly so a
      # future image change fails here rather than as 40 confusing assertion failures.
      - name: Check the engine's own hard requirements
        run: command -v jq && jq --version

      - name: Run engine contract tests
        run: bash tests/run.sh

  # The APK is a real deliverable now, so a Kotlin/Compose error should fail the PR
  # rather than being discovered at build time on someone's machine.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list starts with `tools`, which cmdline-tools 16 no
          # longer publishes: `sdkmanager tools` answers "Failed to find package 'tools'" and
          # the step dies before anything is built. platform-tools is all we actually need here;
          # the platform and build-tools are installed by name in the next step.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Unit tests before the build: the policy/schedule tests are pure Kotlin and fail in
      # seconds, and a red one explains *why* a behaviour is wrong where a compile error in
      # the build output only says that something is.
      - name: Run app unit tests
        working-directory: apk
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK
        working-directory: apk
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: apk/app/build/reports/tests/testDebugUnitTest
          retention-days: 7
